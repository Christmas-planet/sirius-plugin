# ~/.sirius/config.yaml — Siriusのグローバル設定。オペレーターが編集する。
version: 1

# 誰がコードを書き、誰がレビューするか。implementer は claude | codex | pstack、reviewer は claude | codex。
# merge: auto にはこの2つが異なっていることが必要（pstack は自分の中で別モデルのレビューを行うので対象外）。
# pstack: 調査・実装・検証・本番以外へのデプロイ・既存PRへのレビュー対応を pstack:poteto-agent に任せる。
implementer: claude
reviewer: codex

# 任意。ワーカー・レビュワー起動時に渡すモデル名と推論努力度（省略可、空文字なら未指定）。
implementer_model: ""
implementer_effort: ""
reviewer_model: ""
reviewer_effort: ""

# 上限。個々のリポジトリはこれより厳しくできるが、緩くはできない。
implement_gate: human   # human | auto
merge: manual           # manual | auto
reply: {mode: draft}    # draft | send

# none | loop | launchd。1つのキューにつきスケジューラは1つ。リースは機械単位。
scheduler: none

# merge: auto のとき、これらのパスに触れるPRは人が [merge] を付けるのを待つ。
human_paths: [.github/workflows/]

limits:
  new_issues_per_source: 5
  concurrent_workers: 2
