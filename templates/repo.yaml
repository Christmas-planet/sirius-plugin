# ~/.sirius/repos/<owner>__<repo>.yaml — GitHubリポジトリ1つにつき1ファイル。オペレーターが編集する。
# ファイル名は、リポジトリを小文字化して "/" を "__" に置き換えたものにする。
# 例: repo "acme/my-repo" -> acme__my-repo.yaml
repo: acme/my-repo               # 正確な owner/repo。1つのリポジトリは1ファイルにしか属さない
dir: ~/projects/acme/my-repo     # 任意。ローカルのチェックアウト。カレントディレクトリからこのリポジトリを見つけるのに使う

sources:
  slack:
    - {workspace: T0123456789, channel: C0123456789}   # 正確なID。名前やワイルドカードは不可
  line:
    - {chat: "正確なチャット名"}                          # ネイティブのmacOS LINEアプリのみ

reply:                       # Slack/LINEで、依頼してきた人へどう返信するか
  mode: draft                # draft: 送信せず、提案する返信文をIssue/レポートに書くだけ
                              # send: 実際に送信する（Slackはslack_send_message、LINEはComputer Use）
  style: ""                  # 文体Skill名か自由記述。例: "write-like-kazuki"（references/reply-contract.md）
  never: []                  # 絶対に言ってはいけない・約束してはいけないことの自由記述リスト

investigate:                 # 実装役・レビュー役のモデルが読んで従うべき自由記述
  read_first: []              # 作業前にリポジトリ内で読むべきパス。例: [CLAUDE.md, docs/]
  knowledge: []               # リポジトリの外にある、モデルが知っておくべき情報。例:
                               #   - {where: "オーナーとのLINEチャット", what: "デザインの好み"}
  ask_user_when: []           # 推測せずユーザーの判断が必要な状況の自由記述リスト

implement:
  gate: human                 # human: 人が `[implement]` を付ける; auto: 明確なIssueにSiriusが付ける
  conventions: []             # 任意の自由記述リスト。例: PR本文の書式、コミットのルール

review:
  reviewer: ""                # claude | codex。任意。空ならconfig.yamlのグローバルなreviewerを使う
  focus: []                   # 任意の自由記述リスト。レビュワーが特に注意すべき点

verify:
  commands: []                 # 検証の一環として実行する任意のシェルコマンド
  live: []                     # 任意の自由記述。例: [{how: "iOSシミュレータ", evidence: "スクリーンショット"}]
  not_enough: []               # 任意の自由記述リスト。例: ["ビルドログだけでは画面表示の証拠にならない"]
  deploy: []                   # 任意の自由記述リスト。検証で使う本番以外の環境へのデプロイ方法。ワーカーは確認なしで実行してよい。
                                # 例: ["STG: gh workflow run cd-staging.yml -R acme/my-repo --ref <branch>"]

merge:
  mode: manual                 # manual: 人がマージする; auto: すべてのチェックが通ればsirius-mergeがマージする
  ci_required: true
  approvals: 0                 # レビュー用アカウントに加えて必要な人の承認数
  human_branches: {}           # 例: {main: "本番へデプロイされる"} または {"*": "理由"}
  deploys: {}                  # 例: {main: "Vercel本番環境"}
  deploy_workflows: {}         # 例: {main: "Deploy"}；このActionsワークフローを監視し、失敗したらrevert PRを開く。
                                # 指定しないと、デプロイは未検証として報告される。

forbidden: []                  # このリポジトリでモデルが絶対にしてはいけないことの自由記述リスト

notes: |
  エージェントがこのリポジトリについて知っておくべきこと。
